<html>
<head>
<title>jsCav - Linear Cavity Simulator</title>

<link rel="apple-touch-icon" sizes="60x60" href="apple-touch-icon-60x60.png">

<link rel="apple-touch-icon" sizes="114x114" href="apple-touch-icon-114x114.png">

<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">

<style type="text/css">
    /*
       this uses an adapted monokai colour scheme,
       http://www.monokai.nl/blog/2006/07/15/textmate-color-theme/
    */
    body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 15px;
        background-color: #1e1e2e;
        color: #F8F8F2;
        max-width: 1100px;
        margin: 0 auto;
        padding: 1em 1.5em;
        box-sizing: border-box;
    }
    h1 {
        font-size: 200%;
        color: #FD971F;
        margin: 0.2em 0 0.1em;
    }
    .layout {
        display: grid;
        grid-template-columns: minmax(220px, 280px) 1fr;
        gap: 1.5em;
        align-items: start;
    }
    @media (max-width: 640px) {
        .layout {
            grid-template-columns: 1fr;
        }
    }
    fieldset.card {
        border: 1px solid #444;
        border-radius: 8px;
        padding: 0.8em 1em;
        margin: 0 0 1em 0;
        background-color: #252535;
        min-inline-size: 0;
    }
    fieldset.card legend {
        color: #FD971F;
        font-weight: 600;
        font-size: 85%;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0 0.4em;
    }
    h2 {
        font-size: 130%;
        color: #FD971F;
        margin-top: 0;
    }
    em {
        color: #66D9EF;
        font-style: normal;
    }
    s {
        color: #A6E22E;
        font-style: normal;
        text-decoration: none;
    }
    a {
        /*color: #A6E22E;*/
        color: #AE81FF;
        text-decoration: none;
    }
    a:hover {
        color: #F8F8F2;
    }
    button.info-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1.5px solid #AE81FF66;
        background: none;
        color: #AE81FF;
        font-family: Georgia, serif;
        font-size: 10px;
        font-style: italic;
        font-weight: bold;
        cursor: pointer;
        padding: 0;
        margin-left: 0.3em;
        vertical-align: 0.25em;
        line-height: 1;
        transition: border-color 0.15s, color 0.15s, background-color 0.15s;
    }
    button.info-btn:hover {
        border-color: #AE81FF;
        background-color: #AE81FF22;
        color: #C4A8FF;
    }
    #info-popover {
        position: fixed;
        z-index: 1000;
        max-width: 260px;
        background-color: #2a2a3e;
        border: 1px solid #AE81FF55;
        border-radius: 8px;
        padding: 0.6em 0.9em;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        color: #F8F8F2;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        display: none;
    }
    input {
        font-family: 'Roboto Mono', 'sans-serif';
        font-size: 100%;
        border: 1px #333;
    }
    .input_unit {
        display: block;
        width: 140px;
        border: 1px solid #333;
        margin-bottom: 0.5em;
        background-color: #282828;
        color: #E6DB74;
        border-radius: 6px;
    }
    .input_unit input {
        font-family: 'Roboto Mono', 'sans-serif';
        font-size: 100%;
        border: 0;
        width: 100px;
        text-align: right;
        padding-right: 0.2em;
        background-color: #282828;
        color: #66D9EF;
        border-radius: 4px;
    }
    #results {
        font-family: 'Roboto Mono', monospace;
        margin-top: 0;
        padding: 0.75em;
        border: 1px solid #333;
        background-color: #252535;
        border-radius: 8px;
    }
    button#cav_btnUpdate {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 100%;
        font-weight: 600;
        background-color: #FD971F;
        color: #1e1e2e;
        border: none;
        border-radius: 6px;
        padding: 0.4em 1.2em;
        cursor: pointer;
        margin-top: 0.5em;
        transition: background-color 0.15s ease;
    }
    button#cav_btnUpdate:hover {
        background-color: #e6861a;
    }
    button#cav_btnUpdate:active {
        background-color: #c97415;
    }
    table.results-table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Roboto Mono', monospace;
    }
    table.results-table td {
        padding: 0.25em 0.4em;
        border-bottom: 1px solid #333;
        vertical-align: baseline;
    }
    table.results-table td.desc {
        font-family: 'Inter', system-ui, sans-serif;
        color: #F8F8F2;
        width: 100%;
    }
    table.results-table td.value {
        color: #A6E22E;
        text-align: right;
        white-space: nowrap;
    }
    table.results-table td.unit {
        color: #E6DB74;
        padding-left: 0.3em;
        white-space: nowrap;
    }
    table.results-table tr.section-sep td {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 85%;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #FD971F;
        padding-top: 0.8em;
        border-bottom: 1px solid #FD971F44;
    }
    table.results-table tr.warn td.value {
        color: #F92672;
    }
    #copyright {
        margin-top: 1em;
        color: #888;
        font-size: 70%;
    }
    canvas {
        max-width: 100%;
        display: block;
    }
    fieldset.card label:has(input[type="checkbox"]) {
        display: flex;
        align-items: center;
        gap: 0.4em;
        margin-top: 0.4em;
        cursor: pointer;
    }
    a.share-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35em;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 85%;
        color: #AE81FF;
        border: 1px solid #AE81FF44;
        border-radius: 5px;
        padding: 0.25em 0.6em;
        margin-bottom: 0.75em;
        text-decoration: none;
        transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    a.share-btn:hover {
        color: #F8F8F2;
        border-color: #AE81FF80;
        background-color: #AE81FF22;
    }
</style>
</head>
<body>
<script type="text/javascript" src="complex.js"></script>
<script type="text/javascript" src="cavity.js"></script>
<h1>Linear Cavity Calculator</h1>
<div class="layout">
    <div class="inputs-panel">
        <form>
            <fieldset class="card">
                <legend>Mirror M1</legend>
                <input type="radio" name="cav_RT1" id="cav_RT1_R" value="R" checked />
                <label for="cav_RT1_R">Reflectivity</label><br/>
                <input type="radio" name="cav_RT1" id="cav_RT1_T" value="T" />
                <label for="cav_RT1_T">Transmissivity</label>
                <button type="button" class="info-btn" data-info-key="rt">i</button>
                <span class="input_unit" id="cav_M1_R"><input type="number" id="cav_R1" value="98.6" />%</span>
                <span class="input_unit" id="cav_M1_T" style="display:none"><input type="number" id="cav_T1" value="0" />ppm</span>
                <label for="cav_RoC1">Radius of curvature</label>
                <button type="button" class="info-btn" data-info-key="roc">i</button>
                <span class="input_unit"><input type="number" id="cav_RoC1" value="1.5" />m</span>
            </fieldset>
            <fieldset class="card">
                <legend>Mirror M2</legend>
                <input type="radio" name="cav_RT2" id="cav_RT2_R" value="R" checked />
                <label for="cav_RT2_R">Reflectivity</label><br/>
                <input type="radio" name="cav_RT2" id="cav_RT2_T" value="T" />
                <label for="cav_RT2_T">Transmissivity</label>
                <button type="button" class="info-btn" data-info-key="rt">i</button>
                <span class="input_unit" id="cav_M2_R"><input type="number" id="cav_R2" value="99.98" />%</span>
                <span class="input_unit" id="cav_M2_T" style="display:none"><input type="number" id="cav_T2" value="0" />ppm</span>
                <label for="cav_RoC2">Radius of curvature</label>
                <button type="button" class="info-btn" data-info-key="roc">i</button>
                <span class="input_unit"><input type="number" id="cav_RoC2" value="1.5" />m</span>
            </fieldset>
            <fieldset class="card">
                <legend>Geometry</legend>
                <label for="cav_L">Mirror Separation</label>
                <button type="button" class="info-btn" data-info-key="L">i</button>
                <span class="input_unit"><input type="number" id="cav_L" value="2" />m</span>
            </fieldset>
            <fieldset class="card">
                <legend>Light</legend>
                <label for="cav_lambda0">Wavelength</label>
                <button type="button" class="info-btn" data-info-key="lambda">i</button>
                <span class="input_unit"><input type="number" id="cav_lambda0" value="1064" />nm</span>
                <label for="cav_max_order">Max. mode order</label>
                <button type="button" class="info-btn" data-info-key="order">i</button>
                <span class="input_unit"><input type="number" id="cav_max_order" value="10" min="0" max="20" /></span>
            </fieldset>
            <button type="button" id="cav_btnUpdate" onclick="update()">Calculate</button>
        </form>
    </div>
    <div class="results-panel">
        <div id="results">(Results will appear here)</div>
    </div>
</div>
<div id="copyright">&copy; 2016-2026 S. Steinlechner, <a href="https://github.com/sestei/jscav">source code</a> available on github</div>
<script type="text/javascript">
    function swap_R_T(mirror, is_R) {
        var inpR = $('cav_M'+mirror+'_R');
        var inpT = $('cav_M'+mirror+'_T');
        if (is_R) {
            $('cav_T'+mirror).value = R2T($('cav_R'+mirror).value).toFixed(1);
            inpR.style.display = 'none';
            inpT.style.display = 'block';
        } else {
            $('cav_R'+mirror).value = T2R($('cav_T'+mirror).value);
            inpR.style.display = 'block';
            inpT.style.display = 'none';
        }
    }

    function toggle_visibility(obj) {
        obj = $(obj);
        if (obj.style.display == 'block')
            obj.style.display = 'none';
        else
            obj.style.display = 'block';
    }

    var inputs = ["cav_R1", "cav_R2", "cav_T1", "cav_T2", "cav_L",
                  "cav_RoC1", "cav_RoC2", "cav_lambda0", "cav_max_order"];
    var hasResults = false;
    inputs.forEach(function (elem) {
        $(elem).onkeypress = function(e) {
            if (!e)
                e = window.event;
            var keycode = e.keycode || e.which;
            if (keycode == '13')
                update();
        }
    });

    function parseFromURL(urlQuery)
    {
        floatFromParam = function(p) { return parseFloat(urlParams.get(p)); }
        const urlParams = new URLSearchParams(urlQuery);

        var needsUpdate = false;
        inputs.forEach(function (elem) {
            if (urlParams.has(elem)) {
                needsUpdate = true;
                if (elem == 'cav_T1') {
                    $('cav_RT1_T').checked = true;
                    swap_R_T('1', true);
                } else if (elem == 'cav_T2') {
                    $('cav_RT2_T').checked = true;
                    swap_R_T('2', true);
                }
                $(elem).value = floatFromParam(elem);
            }
        });
        return needsUpdate;
    }

    function createURL()
    {
        var url_base = window.location.href.split('?')[0] + '?';
        var params = [];
        inputs.forEach(function (elem) {
            if (elem == 'cav_T1' && $('cav_RT1_R').checked)
                return;
            if (elem == 'cav_T2' && $('cav_RT2_R').checked)
                return;
            params.push(`${elem}=${$(elem).value}`) ;
        });
        return url_base + params.join('&');
    }

    var shareIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle">'
        + '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>'
        + '<polyline points="16 6 12 2 8 6"/>'
        + '<line x1="12" y1="2" x2="12" y2="15"/>'
        + '</svg>';

    function update()
    {
        hasResults = true;
        results = $('results')
        results.innerHTML = `<a class="share-btn" href="${createURL()}">${shareIcon} Link to these results</a>`;
        calculateCavity();
    }

    var radios = ['cav_RT1_R', 'cav_RT1_T', 'cav_RT2_R', 'cav_RT2_T'];
    //$('cav_airy').addEventListener('change', update);
    $('cav_RT1_R').onclick = function(e) { swap_R_T('1', e.checked); }
    $('cav_RT1_T').onclick = function(e) { swap_R_T('1', !e.checked); }
    $('cav_RT2_R').onclick = function(e) { swap_R_T('2', e.checked); }
    $('cav_RT2_T').onclick = function(e) { swap_R_T('2', !e.checked); }

    function debounce(fn, ms) {
        var t; return function() { clearTimeout(t); t = setTimeout(fn, ms); };
    }

    // on devices with a fine pointer (mouse cursor), update the results immediately
    // when changing any of the inputs, on touch devices, show an "Update" button instead,
    // debounce to avoid excessive recalculations while the user is still entering the values
    if (window.matchMedia('(pointer: fine)').matches) {
        var debouncedUpdate = debounce(update, 150);
        inputs.forEach(function(elem) {
            $(elem).addEventListener('input', debouncedUpdate);
        });
        radios.forEach(function(elem) {
            $(elem).addEventListener('change', debouncedUpdate);
        });
        $('cav_btnUpdate').style.display = 'none';
    }

    // redraw canvas when the window is resized (once results have been calculated)
    window.addEventListener('resize', debounce(function() {
        if (hasResults) update();
    }, 150));

    // --- info popovers ---
    var INFO_TEXT = {
        rt:     'Power reflectivity (or transmissivity) of the mirror.<br>' +
                'Reflectivity is entered as a percentage (0&minus;100%). ' +
                'Switch to transmissivity to enter in parts per million (ppm). ' +
                'For a lossless mirror R + T / 10&sup4; = 100%; any difference is treated as loss.',
        roc:    'Radius of curvature of the mirror surface in metres. ' +
                'Enter 0 for a flat mirror. ' +
                'A concave mirror (curving towards the cavity interior) has a positive RoC.',
        L:      'Distance between the two mirror surfaces in metres. ' +
                'The medium between the mirrors is assumed to be air (refractive index n = 1).',
        lambda: 'Operating laser wavelength in nanometres — ' +
                'e.g. 1064 nm for Nd:YAG, 532 nm for frequency-doubled, or 1550 nm for telecom.',
        order:  'Highest transverse mode order N = m + n to display in the mode spectrum.',
        stable: 'Cavity is optically stable when 0 &lt; g<sub>1</sub>&times;g<sub>2</sub> &lt; 1. ' +
                'Only stable cavities support a circulating Gaussian beam mode, so modes and stability parameters are only calculated for stable configurations.',
        fsr:    'Free Spectral Range: the frequency spacing between successive (longitudinal) cavity resonances.',
        finesse: 'Finesse = FSR / linewidth. Higher finesse indicates longer storage time and narrower resonance peaks.',
        fwhm:   'Full Width at Half Maximum of a cavity resonance. The spectral linewidth.',
        pole:   'Cavity pole (half width at half maximum). Equal to FWHM / 2.',
        buildup: 'Power build-up factor inside the cavity relative to incident power at resonance.',
        R:      'Fraction of incident power reflected by the cavity at resonance, neglecting losses.',
        T:      'Fraction of incident power transmitted by the cavity at resonance, neglecting losses.',
        g1g2:   'Product of cavity g-factors:<br>g<sub>1</sub> = 1 &minus; L/RoC<sub>1</sub>, g<sub>2</sub> = 1 &minus; L/RoC<sub>2</sub>.',
        gouy:   'Additional phase accumulated by a Gaussian beam over one round trip, relative to a plane wave.',
        mode_spacing: 'Frequency difference between subsequent transverse modes.',
        mode_spacing_pct: 'Mode spacing expressed as a percentage of the Free Spectral Range.',
        w0:     'Beam waist radius (1/e<sup>2</sup> intensity) at the fundamental mode focus point.',
        z0:     'Position of the beam waist along the cavity axis, measured from mirror M1. '+
                'If the position is negative, the waist is located in front of the cavity, i.e. before M1.',
        w:      'Beam radius (1/e<sup>2</sup> intensity) of the fundamental mode at the mirror.',
    };

    function showInfo(btn, text) {
        var pop = $('info-popover');
        // toggle off when clicking the same button again
        if (pop._source === btn && pop.style.display === 'block') {
            pop.style.display = 'none';
            pop._source = null;
            return;
        }
        pop.innerHTML = text;
        pop._source = btn;
        // position: try right of button first, flip left if it would overflow
        var rect = btn.getBoundingClientRect();
        var left = rect.right + 10;
        if (left + 268 > window.innerWidth - 8) left = Math.max(8, rect.left - 268 - 10);
        var top = Math.max(8, rect.top);
        pop.style.left = left + 'px';
        pop.style.top  = top  + 'px';
        pop.style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        var btn = e.target.closest('button.info-btn');
        if (btn) {
            e.stopPropagation();
            showInfo(btn, INFO_TEXT[btn.dataset.infoKey] || '');
            return;
        }
        // close popover if clicked outside (and not on a button)
        var pop = $('info-popover');
        if (pop.style.display === 'block' && !pop.contains(e.target)) {
            pop.style.display = 'none';
        }
    });

    // read in URL parameters
    parseFromURL(window.location.search);
    // update the results when the page is loaded, but once fonts have loaded
    document.fonts.ready.then(update);

</script>
<div id="info-popover"></div>
</body>
</html>
